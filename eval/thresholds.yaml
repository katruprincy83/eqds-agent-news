# Release gate for the news agent. Each value is the minimum mean score (0 to 1) for that scorer in a run of the suite.
# `python eval/run_eval.py --gate` exits 1 when any value is missed. Set before the first baseline run, not tuned to it.
feed:                          # deterministic synthetic feed: graded on content and behaviour
  answered: 1.0
  correctness: 0.75            # expected facts stated in the answer (LLM judge)
  relevance_to_query: 0.90
  dated_headlines: 0.90
  headlines_only: 0.90         # no causes, prices or valuations inferred from headlines
  states_gaps: 0.90            # says so when the feed cannot answer
  citation_validity: 0.90      # every [N#] resolves to a returned source
  claim_citation_coverage: 0.85
  expected_tools_used: 0.90
  source_system_label: 1.00    # source records name the real system
  within_timeout: 0.90
web:                           # live You.com search: graded on behaviour, not content
  answered: 1.0
  relevance_to_query: 0.90
  dated_sources: 0.80
  only_search_results: 0.90
  citation_validity: 0.90
  expected_tools_used: 0.90
  source_system_label: 1.00
  within_timeout: 0.90
